# Contenedor cliente netshoot para pruebas manuales/interactivas desde una VM
# de Domain 3 (Docker + Docker Compose ya instalados en la VM).
#
# `network_mode: host` hace que el trafico salga con la IP propia de la VM
# (la IP "bien conocida" de ingress/egress descrita en el README), en vez de
# la IP interna del contenedor.
#
# Uso:
#   docker compose -f manifests/netshoot-client-docker-compose.yml up -d
#   docker compose -f manifests/netshoot-client-docker-compose.yml exec netshoot bash
#   # dentro del contenedor: nc -zv <ip> <puerto> ; curl -kv https://<ip>:<puerto> ; ping <ip> ; tcptraceroute <ip> <puerto>
services:
  netshoot:
    image: nicolaka/netshoot:v0.15
    network_mode: host
    command: ["sleep", "infinity"]
