# Netshoot client container for manual/interactive tests from a
# Local cloud domain VM (Docker + Docker Compose already installed on the VM).
#
# `network_mode: host` makes traffic leave with the VM's own IP
# (the "well-known" ingress/egress IP described in the README), instead of
# the container's internal IP.
#
# Usage:
#   docker compose -f manifests/netshoot-client-docker-compose.yml up -d
#   docker compose -f manifests/netshoot-client-docker-compose.yml exec netshoot bash
#   # inside the container: nc -zv <ip> <port> ; curl -kv https://<ip>:<port> ; ping <ip> ; tcptraceroute <ip> <port>
services:
  netshoot:
    image: nicolaka/netshoot:v0.15
    network_mode: host
    command: ["sleep", "infinity"]
