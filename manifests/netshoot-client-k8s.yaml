# Persistent netshoot client pod for Local cloud domain -> Remote cloud domain connectivity tests.
#
# Applied and operated from the lab PC (kubectl with direct
# access to the cluster). Deploy in the SAME namespace as the real
# microservices whose connectivity is being validated, to inherit the same
# NAT Gateway egress / the same NetworkPolicies as those microservices.
#
# Manual interactive usage:
#   kubectl apply -f manifests/netshoot-client-k8s.yaml
#   kubectl exec -it deploy/netshoot-client -- bash
#   # inside the pod: nc -zv <ip> <port> ; curl -kv https://<ip>:<port> ; ping <ip> ; tcptraceroute <ip> <port>
#
# Automated usage (see src/run_via_kubectl.sh):
#   kubectl cp src/run_probe.py deploy/netshoot-client:/tmp/run_probe.py
#   kubectl cp inputs/connectivity-test-spec.json deploy/netshoot-client:/tmp/spec.json
#   kubectl exec deploy/netshoot-client -- python3 /tmp/run_probe.py --spec /tmp/spec.json --out /tmp/result.log
#   kubectl cp deploy/netshoot-client:/tmp/result.log outputs/result.log
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netshoot-client
  labels:
    app: netshoot-client
    purpose: connectivity-test-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netshoot-client
  template:
    metadata:
      labels:
        app: netshoot-client
        purpose: connectivity-test-client
    spec:
      containers:
        - name: netshoot
          image: nicolaka/netshoot:v0.15
          command: ["sleep", "infinity"]
